services:
  - type: web
    name: docukeep-api
    runtime: node
    plan: starter
    buildCommand: npm ci --omit=dev
    startCommand: npm --prefix server start
    healthCheckPath: /api/health
    disk:
      name: docukeep-uploads
      mountPath: /opt/render/project/src/server/uploads
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: CLIENT_URL
        value: https://bwt-project.vercel.app
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
